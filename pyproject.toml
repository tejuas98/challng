[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schemforge"
version = "0.1.0"
description = "SchemForge: Automated Visual Task Factory for Multi-Hop Engineering Schematic Reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
schemforge = "schemforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
